workflows:
  android-workflow:
    name: Global Digital Udhar Book Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Clean Environment And Create Android
        script: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android --project-name=global_digital_uzhar_book
      - name: Get Dependencies
        script: |
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

